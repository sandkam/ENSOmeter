# Place at .github/workflows/update.yml
name: Update ENSO data
on:
  schedule:
    - cron: "17 6 * * *"   # daily; CPC updates weekly (Mondays)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python update_data.py
      - run: |
          git config user.name "enso-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update ENSO data" && git push)
